<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Free-tier comparison</title>
<style>
:root { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
body { margin: 0; padding: 12px; background: transparent; }
.card { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 14px; overflow: hidden; }
.header { padding: 14px 16px 10px; }
h2 { margin: 0; font-size: 17px; line-height: 1.25; }
.sub { opacity: .68; font-size: 12px; margin-top: 4px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
.score { font-variant-numeric: tabular-nums; font-weight: 650; }
.badge { display: inline-block; border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 999px; padding: 2px 7px; font-size: 11px; }
a { color: inherit; text-underline-offset: 2px; }
ul { margin: 10px 16px 14px 30px; padding: 0; font-size: 12px; opacity: .8; }
.empty { padding: 18px 16px; opacity: .65; }
</style>
</head>
<body>
<div class="card">
  <div class="header"><h2 id="title">Free-tier comparison</h2><div class="sub" id="count">Waiting for data…</div></div>
  <div id="content" class="empty">No comparison data received.</div>
  <ul id="notes" hidden></ul>
</div>
<script>
const titleEl = document.getElementById('title');
const countEl = document.getElementById('count');
const contentEl = document.getElementById('content');
const notesEl = document.getElementById('notes');
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(data) {
  const services = Array.isArray(data?.services) ? data.services : [];
  titleEl.textContent = data?.title || 'Free-tier comparison';
  countEl.textContent = `${services.length} candidate${services.length === 1 ? '' : 's'}`;
  if (!services.length) { contentEl.className='empty'; contentEl.textContent='No candidates to display.'; return; }
  const rows = services.map((s, i) => {
    const name = esc(s.name || s.title || `Candidate ${i+1}`);
    const url = typeof s.url === 'string' && /^https?:\/\//.test(s.url) ? `<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${name}</a>` : name;
    const score = s.score == null ? '—' : esc(s.score);
    const category = esc(s.category || s.status || '—');
    const detail = esc(s.description || s.reason || s.notes || '');
    return `<tr><td>${url}</td><td><span class="score">${score}</span></td><td><span class="badge">${category}</span></td><td>${detail}</td></tr>`;
  }).join('');
  contentEl.className='table-wrap';
  contentEl.innerHTML = `<table><thead><tr><th>Service</th><th>Score</th><th>Category / status</th><th>Evidence / notes</th></tr></thead><tbody>${rows}</tbody></table>`;
  const notes = Array.isArray(data?.notes) ? data.notes : [];
  notesEl.hidden = notes.length === 0;
  notesEl.innerHTML = notes.map(n => `<li>${esc(n)}</li>`).join('');
}
window.addEventListener('message', (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data;
  if (!msg || msg.jsonrpc !== '2.0') return;
  if (msg.method === 'ui/notifications/tool-result') render(msg.params?.structuredContent);
}, { passive: true });
if (window.openai?.toolOutput) render(window.openai.toolOutput);
</script>
</body>
</html>
