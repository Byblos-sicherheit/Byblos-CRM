name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check

  agent-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: python -m compileall -q byblos_agent tests
      - run: python -c "import google.antigravity; import byblos_agent"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - name: Verify Android project
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-and-reports
          if-no-files-found: warn
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/reports/**
            android-app/app/build/test-results/**
