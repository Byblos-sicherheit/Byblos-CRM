[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byblos-antigravity-backend"
version = "0.1.0"
description = "Provider-compatible SSE backend for the Byblos Android app"
requires-python = ">=3.11"
dependencies = [
  "google-antigravity==0.1.8",
  "uvicorn>=0.46,<0.47",
]

[project.scripts]
byblos-agent-server = "byblos_agent.server:main"

[tool.setuptools.packages.find]
include = ["byblos_agent*"]
