services:
  agent-backend:
    build: .
    env_file: .env
    ports:
      - "3100:3100"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/runtime:size=256m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
