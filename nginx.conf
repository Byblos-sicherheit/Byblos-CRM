events { worker_connections 1024; }

http {
    # Gzip
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=crm:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # HTTP → HTTPS Redirect
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS CRM App
    server {
        listen 443 ssl http2;
        server_name crm.byblos.de;

        ssl_certificate     /etc/letsencrypt/live/crm.byblos.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crm.byblos.de/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Streamlit App
        location / {
            limit_req zone=crm burst=20 nodelay;
            proxy_pass http://byblos-crm:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://byblos-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # HTTP (ohne SSL – für lokale Installation)
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location / {
            proxy_pass http://byblos-crm:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://byblos-api:8000;
        }
    }
}
