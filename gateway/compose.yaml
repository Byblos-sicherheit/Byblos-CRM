name: byblos-gateway

services:
  gateway:
    image: caddy:2.11.4-alpine
    container_name: byblos-gateway
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN muss in .env gesetzt sein}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL muss in .env gesetzt sein}"
      LEXAI_UPSTREAM: "${LEXAI_UPSTREAM:?LEXAI_UPSTREAM muss in .env gesetzt sein}"
      CRM_UPSTREAM: "${CRM_UPSTREAM:?CRM_UPSTREAM muss in .env gesetzt sein}"
      WKS_UPSTREAM: "${WKS_UPSTREAM:?WKS_UPSTREAM muss in .env gesetzt sein}"
      FILES_UPSTREAM: "${FILES_UPSTREAM:?FILES_UPSTREAM muss in .env gesetzt sein}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
    name: byblos_gateway_data
  caddy_config:
    name: byblos_gateway_config
  caddy_logs:
    name: byblos_gateway_logs
