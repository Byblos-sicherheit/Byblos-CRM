[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "byblos-crm"
version = "2.0.0"
description = "Open Source CRM für Sicherheitsdienstleister"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Byblos Sicherheitsdienst", email = "info@byblos.de"}
]
keywords = ["crm", "sicherheitsdienst", "wachdienst", "security", "streamlit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Natural Language :: German",
]
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "qrcode[pil]>=7.4.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "cryptography>=41.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17.0"]
pdf_embed = ["pikepdf>=8.0.0"]
full = ["byblos-crm[ocr,pdf_embed]"]

[project.urls]
Homepage = "https://github.com/byblos-security/byblos-crm"
Repository = "https://github.com/byblos-security/byblos-crm"
"Bug Tracker" = "https://github.com/byblos-security/byblos-crm/issues"
Documentation = "https://github.com/byblos-security/byblos-crm/wiki"
Changelog = "https://github.com/byblos-security/byblos-crm/blob/main/CHANGELOG.md"

[project.scripts]
byblos-crm = "byblos_crm_app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["byblos_crm_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
